<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginPage</title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="logincontainer">
        <div class="login">

            <div class="content">
                <h1>LoginPage</h1>
                <p>Your Favorite Food, Just a Click Away</p>
            </div>

            <div class="matter">

                <form>

                    <label for="emailid"></label>
                    <input type="text" id="emailid" placeholder="Enter your Emailid"><br><br>

                    <label for="Password"></label>

                   <div class="password-box">
    <input type="password" id="Password" placeholder="Enter your Password">
    <i class="bi bi-eye-slash" onclick="togglePassword()" id="toggleIcon"></i>
</div>

                    <br><br>

                </form>

                <button type="submit" onclick="login()">LOG IN</button><br>

                <p class="forgotpassword">
                    <a class="nav-link" href="#">
                        <i class="bi bi-person-plus-fill"></i>
                        Forgot Password?
                    </a>
                </p>

                <p>
                    Don't have an account yet ?
                    <a class="nav-link" href="signup.html">
                        <i class="bi bi-person-plus-fill"></i>
                        Signup
                    </a>
                </p>

                <br><br>

            </div>

        </div>
    </div>

    <script src="login.js"></script>

</body>
</html>
