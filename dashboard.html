<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOODIEz Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    

<nav class="navbar">

    <div class="logo">
        <img src="logo.jpg" alt="">
        <h2>FOODIEz</h2>
    </div>

    <a href="dashboard.html" class="home-btn">
        <i class="bi bi-house-door-fill"></i>
        Home
    </a>

    <div class="search-box">
        <input type="text" placeholder="Search recipes...">
        <button>
            <i class="bi bi-search"></i>
            Search
        </button>
    </div>

    <button class="logout-btn" onclick="logout()">
        <i class="bi bi-box-arrow-right"></i>
        Logout
    </button>

</nav>



<div class="dashboard">

    <div class="hero">

<h2>🍕 Explore Delicious Food Around You</h2>

<p>
Find recipes, restaurants, favourite dishes and order your meals easily.
</p>

<button>Explore Now</button>

</div>

    <div class="cards">

        <div class="card">
            <i class="bi bi-journal-richtext"></i>
            <h3>Recipes</h3>
            <p>Browse tasty recipes.</p>
            <button class="open-btn" onclick="location.href='recipes.html'">
Open
</button>
        </div>

        <div class="card">
            <i class="bi bi-shop"></i>
            <h3>Restaurants</h3>
            <p>Find nearby restaurants.</p>
           <button class="open-btn" onclick="location.href='restaurant.html'">
Open
</button>
        </div>

        <div class="card">
            <i class="bi bi-heart-fill"></i>
            <h3>Favorites</h3>
            <p>Your favourite foods.</p>
         <button class="open-btn" onclick="window.location.href='favorite.html'">Open</button>


        </div>

        <div class="card">
            <i class="bi bi-cart-fill"></i>
            <h3>Cart</h3>
            <p>View your cart.</p>
         <button class="open-btn" onclick="window.location.href='cart.html'">
Open
</button>
        </div>

    </div>

</div>

<script src="dashboard.js"></script>

</body>
</html>
