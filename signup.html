<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignupPage</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<link rel="stylesheet" href="signup.css">
<body>
    <div class="signup-container">
        <div class="sign-box">
         <div class="content">
        <h2 class="createaccount">SignUp 🍽️</h2>
        <p>Join FOODIEz and enjoy delicious meals!</p>
        </div>
     <form>

    <input type="text" id="fullname" placeholder="Enter your full name"><br><br>

    <input type="text" id="Emailid" placeholder="Enter your Email Id"><br><br>

    <div class="password-box">
        <input type="password" id="Password" placeholder="Enter your Password">
        <i class="bi bi-eye-slash" id="toggleIcon" onclick="togglePassword()"></i>
    </div>

    <button type="submit" onclick="savedata(event)">Create Account</button><br>

    <p class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</form>
      </div>
    </div>
    <script src="signup.js"></script>
</body>
</html>
